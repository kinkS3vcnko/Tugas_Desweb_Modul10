
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Latihan 1 - Kalkulator</title>

    <link rel="stylesheet" href="style.css">
    <script src="main1.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>Kalkulator Sederhana</h1>

        <label for="angka1">Angka Pertama:</label>
        <input type="number" id="angka1" step="any">

        <label for="angka2">Angka Kedua:</label>
        <input type="number" id="angka2" step="any">

        <div class="buttons">
            <button id="tambah">Penjumlahan (+)</button>
            <button id="kurang">Pengurangan (-)</button>
            <button id="kali">Perkalian (*)</button>
            <button id="bagi">Pembagian (/)</button>
        </div>

        <h3 id="hasil">Hasil:</h3>
    </div>

</body>
</html>
